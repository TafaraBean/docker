version: "3.8"

services:
  n8n:
    image: n8nio/n8n:2.6.3
    container_name: n8n_main
    restart: unless-stopped
    ports:
      - "5678:5678"
      - "5679:5679"
    environment:
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=1234
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
    volumes:
      - n8n_data:/home/node/.n8n

  n8n-runner:
    image: n8nio/runners:2.6.3   # or your matching version
    container_name: n8n_runner
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=1234
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n_main:5679
      # Python security config (for Code node)
      - N8N_RUNNERS_STDLIB_ALLOW=*          # allow all stdlib modules
      - N8N_RUNNERS_EXTERNAL_ALLOW=yfinance # or "numpy,pandas,yfinance", etc.
    depends_on:
      - n8n

volumes:
  n8n_data: